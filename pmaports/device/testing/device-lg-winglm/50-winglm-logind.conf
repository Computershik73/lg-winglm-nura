[Login]
# A short press used to power the phone off, and shutting the display down
# then hung the SDE driver until the watchdog bit. Let the shell handle it.
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
# The swivel sensor reports as a lid switch; the phone is used closed
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
