[UPower]
# The swivel's position sensor reports as a lid switch (gpio-keys SW_LID,
# "closed" when the swivel is closed). Both screens are built in, so GNOME
# Settings took a "closed lid" as "no usable display": the Displays page went
# empty and Settings crashed on start. The phone is used with the swivel
# closed; it is not a lid.
IgnoreLid=true
