# LG Wing (LM-F100N) on the downstream 4.19 kernel: Qualcomm "lito-mtp"
# sound card. Routes from LG's vendor mixer_paths.xml.

SectionUseCase."HiFi" {
	File "/conf.d/lito-mtp-snd-ca/HiFi.conf"
	Comment "Play and record HiFi quality music"
}

SectionUseCase."Voice Call" {
	File "/conf.d/lito-mtp-snd-ca/VoiceCall.conf"
	Comment "Phone call (voice through the DSP, see q6voiced)"
}
