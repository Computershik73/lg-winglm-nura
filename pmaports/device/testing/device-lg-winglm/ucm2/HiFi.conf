# Playback through MultiMedia1 (PCM 0), capture through MultiMedia2 (PCM 1).
# These front ends only open with a back end routed (DPCM), and PulseAudio
# probes them before enabling any device: the verb routes the defaults
# (speaker, main microphone) and the devices switch the routes, going back
# to the defaults when disabled instead of leaving nothing routed.

SectionVerb {
	EnableSequence [
		cset "name='PRIM_MI2S_RX Channels' One"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Volume' 6"
		cset "name='MultiMedia2 Mixer TX_CDC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CDC_DMA_TX_3' 0"
		cset "name='MultiMedia2 Mixer TX_CDC_DMA_TX_4' 0"
	]
	Value {
		TQ "HiFi"
	}
}

# NXP TFA9878 smart amplifier on the primary MI2S port. Its speaker
# protection runs in the ADSP and needs Android's audio HAL; without it the
# amplifier plays unprotected, so keep long full-volume playback away.
# There is one amplifier and it only takes the left I2S slot: the back end
# runs mono, so the DSP mixes both channels into it.
SectionDevice."Speaker" {
	Comment "Speaker"
	EnableSequence [
		cset "name='PRIM_MI2S_RX Channels' One"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# WCD938x codec, headphone outputs
SectionDevice."Headphones" {
	Comment "Headphones"
	EnableSequence [
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX_CDC_DMA_RX_0 Channels' Two"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 1"
		cset "name='RX_COMP2 Switch' 1"
		cset "name='HPHL_COMP Switch' 1"
		cset "name='HPHR_COMP Switch' 1"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='RX_HPH_PWR_MODE' LOHIFI"
		cset "name='RX HPH Mode' CLS_H_LOHIFI"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='RX_MACRO RX1 MUX' ZERO"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# Earpiece (receiver) through the WCD938x EAR output
SectionDevice."Earpiece" {
	Comment "Earpiece"
	EnableSequence [
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_CDC_DMA_RX_0 Channels' One"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_HPH_PWR_MODE' ULP"
		cset "name='RX HPH Mode' CLS_H_ULP"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='RDAC3_MUX' RX1"
		cset "name='RX_EAR Mode' ON"
		cset "name='EAR PA GAIN' G_0_DB"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='RX_EAR Mode' OFF"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# Main microphone (amic1 -> TX DEC0 -> TX_CDC_DMA_TX_3)
SectionDevice."Mic" {
	Comment "Microphone"
	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Volume' 6"
		cset "name='MultiMedia2 Mixer TX_CDC_DMA_TX_4' 0"
		cset "name='MultiMedia2 Mixer TX_CDC_DMA_TX_3' 1"
	]
	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}

# Headset microphone (amic2 -> TX DEC0 -> TX_CDC_DMA_TX_4)
SectionDevice."HeadsetMic" {
	Comment "Headset Microphone"
	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC1"
		cset "name='TX_CDC_DMA_TX_4 Channels' One"
		cset "name='TX_AIF2_CAP Mixer DEC0' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' INP2"
		cset "name='MultiMedia2 Mixer TX_CDC_DMA_TX_3' 0"
		cset "name='MultiMedia2 Mixer TX_CDC_DMA_TX_4' 1"
	]
	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CDC_DMA_TX_4' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='TX_AIF2_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='MultiMedia2 Mixer TX_CDC_DMA_TX_3' 1"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
